name: Build Rudras Creation APK

on:
  workflow_dispatch:
    inputs:
      update_manifest_url:
        description: "Optional HTTPS URL for the app update manifest"
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UPDATE_MANIFEST_URL: ${{ inputs.update_manifest_url }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build temporary test-signed APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease -PuseTemporaryTestSigning=true -PrudrasUpdateManifestUrl="${UPDATE_MANIFEST_URL}"

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            test -n "$(adb shell pm path com.rudras.creation)"
            adb shell am force-stop com.rudras.creation
            adb shell am start -n com.rudras.creation/.MainActivity
            sleep 8
            test -n "$(adb shell pidof com.rudras.creation)"

      - name: Upload test-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: rudras-creation-test-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
